name: Desktop builds

# Builds installers for Windows, macOS and Linux. Run it by hand from the Actions tab,
# or push a tag like v0.2.0 to attach the installers to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Claudus {0}', github.ref_name) || '' }}
          releaseDraft: true
      - name: Keep installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudus-${{ matrix.platform }}
          path: |
            packages/app/src-tauri/target/release/bundle/**/*.msi
            packages/app/src-tauri/target/release/bundle/**/*.exe
            packages/app/src-tauri/target/release/bundle/**/*.dmg
            packages/app/src-tauri/target/release/bundle/**/*.AppImage
            packages/app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: ignore
